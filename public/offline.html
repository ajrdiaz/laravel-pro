<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Sin conexión - Ruta Laravel</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #ffffff;
                --fg: #171717;
                --muted: #6b6b6b;
                --border: #e5e5e5;
                --accent: #1a1a1a;
                --accent-fg: #fafafa;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0a0a0a;
                    --fg: #fafafa;
                    --muted: #a3a3a3;
                    --border: #2a2a2a;
                    --accent: #fafafa;
                    --accent-fg: #171717;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 16px;
                background: var(--bg);
                color: var(--fg);
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
                line-height: 1.5;
            }

            main {
                max-width: 28rem;
            }

            .command {
                font-family:
                    ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
                font-size: 0.75rem;
                color: var(--muted);
            }

            h1 {
                margin: 0.25rem 0 0.75rem;
                font-size: 1.75rem;
                letter-spacing: -0.02em;
            }

            p {
                margin: 0 0 1rem;
                color: var(--muted);
            }

            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            a,
            button {
                font: inherit;
                font-size: 0.875rem;
                font-weight: 500;
                padding: 0.5rem 1rem;
                border-radius: 0.5rem;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--fg);
                text-decoration: none;
                cursor: pointer;
            }

            button {
                background: var(--accent);
                color: var(--accent-fg);
                border-color: var(--accent);
            }

            a:focus-visible,
            button:focus-visible {
                outline: 3px solid var(--muted);
                outline-offset: 2px;
            }
        </style>
    </head>
    <body>
        <main>
            <span class="command">$ ping ruta-laravel</span>
            <h1>Sin conexión</h1>
            <p>
                Esta página no está guardada en tu dispositivo. Las lecciones
                que ya abriste antes sí se pueden leer sin conexión: ábrelas
                desde la lista de lecciones.
            </p>
            <div class="actions">
                <button type="button" onclick="location.reload()">
                    Reintentar
                </button>
                <a href="/learn">Ir a las lecciones</a>
            </div>
        </main>
    </body>
</html>
