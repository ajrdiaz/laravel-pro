; Settings for running the app in production, on top of the image's defaults.

expose_php = Off
memory_limit = 256M

; The code never changes while the container runs (a new version is a new image), so PHP
; does not need to check the files for changes on every request.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; Errors go to the log (stderr), never to the page.
display_errors = Off
log_errors = On
