name: docker

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the production image and checks it the way a server would run it, see
      # docker/smoke-test.sh. Nothing is published.
      - name: Build the image and run the smoke test
        run: bash docker/smoke-test.sh
